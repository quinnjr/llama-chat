name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # sqlite-vector-rs loads its extension at runtime from the path in
      # .cargo/config.toml (SQLITE_VECTOR_RS_LIB=target/debug/libsqlite_vector_rs.so).
      # cargo only emits the dependency's cdylib into target/debug/deps/ with a
      # hash, so build first and copy it to the expected unhashed path. The
      # unhashed file name is required: SQLite derives the extension entry-point
      # symbol from it (sqlite3_sqlitevectorrs_init).
      - name: Build sqlite-vector-rs extension
        run: |
          cargo build
          cp "$(find target/debug/deps -maxdepth 1 -name 'libsqlite_vector_rs-*.so' -type f | head -1)" \
            target/debug/libsqlite_vector_rs.so
      - run: cargo test

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

